openapi: 3.0.3

info:
  title: API de Sugestões dos Alunos
  version: 2.0.0
  description: API para registar e consultar sugestões dos alunos com autenticação e autorização.

servers:
  - url: https://api.estgv.exemplo/v2

security:
  - tokenJWT: []

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      description: "Papel admitido: `aluno` ou `servicos`. O `aluno` obtém apenas as suas sugestões; `servicos` obtém todas."
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/Estado'
        - name: categoria
          in: query
          schema:
            $ref: '#/components/schemas/CodigoCategoria'
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
        - name: tamanhoPagina
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Lista de sugestões obtida com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        default:
          $ref: '#/components/responses/ErroGenerico'

    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      description: "Papel admitido: `aluno`. O `numeroAluno` da sugestão é o do token, não o do corpo do pedido."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '201':
          description: Sugestão criada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /sugestoes/{id}:
    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      description: "Papel admitido: `aluno` ou `servicos`. O `aluno` só pode consultar as suas sugestões."
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-None-Match
          in: header
          required: false
          description: ETag da versão que o cliente já possui.
          schema:
            type: string
      responses:
        '200':
          description: Sugestão encontrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                titulo: "Melhorar a biblioteca"
                descricao: "Proponho alargar o horário da biblioteca durante a época de exames."
                categoria: "instalacoes"
                numeroAluno: "12345"
                id: 42
                estado: "aceite"
                dataCriacao: '2026-10-01T10:30:00Z'
                dataAtualizacao: '2026-10-05T14:00:00Z'
                dataResolucao: null
        '304':
          description: A versão não foi alterada; reutilizar a representação em cache.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/Erro404'
        default:
          $ref: '#/components/responses/ErroGenerico'

    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      description: "Papel admitido: `aluno`, apenas nas suas sugestões."
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-Match
          in: header
          required: true
          description: ETag da versão que o cliente pretende substituir.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '200':
          description: Sugestão atualizada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '412':
          $ref: '#/components/responses/Erro412'
        default:
          $ref: '#/components/responses/ErroGenerico'

    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão ainda submetida
      description: "Papel admitido: `aluno`, apenas nas suas sugestões."
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Sugestão retirada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /sugestoes/{id}/acompanhamentos:
    get:
      operationId: listarAcompanhamentos
      summary: Histórico de acompanhamento, do mais antigo para o mais recente
      description: "Papel admitido: `aluno` ou `servicos`. O `aluno` só pode consultar o histórico das suas sugestões."
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Histórico de acompanhamento obtido com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/Erro404'
        default:
          $ref: '#/components/responses/ErroGenerico'

    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      description: "Papel admitido: `servicos`. O `responsavel` é o nome constante do token."
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      responses:
        '201':
          description: Acompanhamento registado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      security: []
      parameters:
        - $ref: '#/components/parameters/anoLetivo'
      responses:
        '200':
          description: Estatísticas de resolução obtidas com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePublicHour'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
              example:
                anoLetivo: "2026-2027"
                totalSugestoes: 20
                porEstado:
                  submetida: 4
                  em_analise: 3
                  aceite: 5
                  rejeitada: 2
                  resolvida: 6
                taxaResolucao: 0.3
                tempoMedioResolucaoDias: 12.5
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Os mesmos indicadores, por categoria
      security: []
      parameters:
        - $ref: '#/components/parameters/anoLetivo'
      responses:
        '200':
          description: Estatísticas por categoria obtidas com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePublicHour'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      security: []
      responses:
        '200':
          description: Categorias disponíveis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePublicDay'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /tokens:
    post:
      operationId: criarToken
      summary: Autenticar e obter um token JWT
      description: "Operação pública. Troca as credenciais do utilizador por um token JWT, a enviar nas restantes operações no cabeçalho Authorization."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: Token criado com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSIsIm5vbWUiOiJBbmEgU2lsdmEiLCJwYXBlbCI6ImFsdW5vIiwiaWF0IjoxNzkyNzQ5MDAwLCJleHAiOjE3OTI3NDk5MDB9.wPw8cT8JpDOErAj32R_KQw3LxkZv_5KEzkVxvcLI-fk"
                tipo: "Bearer"
                expiraEm: 900
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        default:
          $ref: '#/components/responses/ErroGenerico'

components:
  securitySchemes:
    tokenJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT enviado no cabeçalho `Authorization: Bearer <token>`.

        O token é válido durante 15 minutos (900 segundos), sem renovação; após a expiração é necessária nova autenticação.

        Claims do payload:

        | Claim   | Tipo    | Significado |
        |---------|---------|-------------|
        | `sub`   | string  | Identificador do utilizador autenticado (o `utilizador`). |
        | `nome`  | string  | Nome do utilizador. |
        | `papel` | string  | Papel do utilizador: `aluno` ou `servicos`. |
        | `iat`   | integer | Instante de emissão do token (*issued at*), em segundos desde a época Unix. |
        | `exp`   | integer | Instante de expiração do token, em segundos desde a época Unix. |

  parameters:
    id:
      name: id
      in: path
      required: true
      description: Identificador positivo de uma sugestão.
      schema:
        type: integer
        minimum: 1

    anoLetivo:
      name: anoLetivo
      in: query
      required: true
      description: Ano letivo no formato AAAA-AAAA.
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{4}$'
      example: "2026-2027"

  headers:
    CachePublicDay:
      description: Resposta pública em cache durante 24 horas.
      schema:
        type: string
        enum:
          - 'public, max-age=86400'

    CachePublicHour:
      description: Resposta pública em cache durante uma hora.
      schema:
        type: string
        enum:
          - 'public, max-age=3600'

    CachePrivateNoCache:
      description: Resposta privada que deve ser revalidada antes de reutilizar.
      schema:
        type: string
        enum:
          - 'private, no-cache'

    CacheNoStore:
      description: A resposta não deve ser armazenada em cache.
      schema:
        type: string
        enum:
          - 'no-store'

    WWW-Authenticate:
      description: Esquema de autenticação exigido para aceder ao recurso.
      schema:
        type: string
        enum:
          - 'Bearer'
          - 'Bearer error="invalid_token"'

    ETag:
      description: Etiqueta que identifica a versão da representação.
      schema:
        type: string
      example: '"v3"'

    Location:
      description: URI da nova sugestão criada.
      schema:
        type: string
      example: /sugestoes/42

  responses:
    Erro400:
      description: Pedido inválido ou parâmetros/corpo que não cumprem o contrato.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    NaoAutenticado:
      description: Token em falta, inválido ou expirado.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: 401
            mensagem: "Token em falta, inválido ou expirado."

    CredenciaisInvalidas:
      description: Credenciais inválidas.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Proibido:
      description: O papel do utilizador não admite a operação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Erro404:
      description: A sugestão ou o recurso solicitado não existe. É também a resposta a um aluno que pede uma sugestão de que não é autor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Erro409:
      description: >-
        Conflito com as regras do domínio: editar ou retirar uma sugestão que já não está submetida; registar uma transição de estado não permitida; ou tentar alterar uma sugestão fechada (rejeitada ou resolvida). As transições permitidas são submetida para em_analise, em_analise para aceite ou rejeitada, e aceite para resolvida.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Erro412:
      description: A condição If-Match não corresponde à versão atual.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ErroGenerico:
      description: Erro não especificado para esta operação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Estado:
      type: string
      enum:
        - submetida
        - em_analise
        - aceite
        - rejeitada
        - resolvida

    CodigoCategoria:
      type: string
      enum:
        - instalacoes
        - ensino
        - servicos
        - atividades
        - outra

    Categoria:
      type: object
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        descricao:
          type: string
          minLength: 3
          maxLength: 80
      required:
        - codigo
        - descricao

    SugestaoNova:
      type: object
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: '#/components/schemas/CodigoCategoria'
      required:
        - titulo
        - descricao
        - categoria

    Sugestao:
      allOf:
        - $ref: '#/components/schemas/SugestaoNova'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            numeroAluno:
              type: string
              pattern: '^[0-9]{5,8}$'
              readOnly: true
            estado:
              $ref: '#/components/schemas/Estado'
              readOnly: true
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true
          required:
            - id
            - numeroAluno
            - estado
            - dataCriacao
            - dataAtualizacao
            - dataResolucao

    AcompanhamentoNovo:
      type: object
      properties:
        novoEstado:
          $ref: '#/components/schemas/Estado'
        nota:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - novoEstado
        - nota

    Acompanhamento:
      allOf:
        - $ref: '#/components/schemas/AcompanhamentoNovo'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            responsavel:
              type: string
              minLength: 5
              maxLength: 60
              pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'
              readOnly: true
            estadoAnterior:
              $ref: '#/components/schemas/Estado'
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true
          required:
            - id
            - responsavel
            - estadoAnterior
            - data

    ListaSugestoes:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Sugestao'
          maxItems: 50
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens

    EstatisticasResolucao:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
          required:
            - submetida
            - em_analise
            - aceite
            - rejeitada
            - resolvida
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true
      required:
        - anoLetivo
        - totalSugestoes
        - porEstado
        - taxaResolucao
        - tempoMedioResolucaoDias

    EstatisticasCategorias:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              categoria:
                $ref: '#/components/schemas/Categoria'
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1
            required:
              - categoria
              - total
              - resolvidas
              - taxaResolucao
      required:
        - anoLetivo
        - categorias

    Credenciais:
      type: object
      properties:
        utilizador:
          type: string
          description: Número de aluno (5 a 8 dígitos) ou identificador no formato nome.apelido (minúsculas).
          pattern: '^([0-9]{5,8}|[a-z]+\.[a-z]+)$'
          example: "12345"
        palavraPasse:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
      required:
        - utilizador
        - palavraPasse

    Token:
      type: object
      properties:
        token:
          type: string
          description: Token JWT assinado, com três partes base64url separadas por pontos (cabeçalho.payload.assinatura).
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        tipo:
          type: string
          enum:
            - Bearer
        expiraEm:
          type: integer
          minimum: 1
          description: Validade do token, em segundos a partir da emissão (900, ou seja, 15 minutos).
      required:
        - token
        - tipo
        - expiraEm

    Erro:
      type: object
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              problema:
                type: string
            required:
              - campo
              - problema
      required:
        - codigo
        - mensagem